<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="A calendar page whose days a rule picks: every third day lit, the start glowing, a recurrence arrow on its header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c31"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="88" y1="120" x2="424" y2="416">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- the page and its header -->
  <rect x="88" y="120" width="336" height="296" rx="40" fill="#0a1020"/>
  <path d="M88 160 A40 40 0 0 1 128 120 H384 A40 40 0 0 1 424 160 V184 H88 Z" fill="url(#face)"/>
  <rect x="88" y="120" width="336" height="296" rx="40" fill="none" stroke="url(#face)" stroke-width="18"/>

  <!-- recurrence -->
  <g fill="none" stroke="#0a1020" stroke-width="6" stroke-linecap="round">
    <path d="M256 135 A17 17 0 1 1 241.3 143.5"/>
  </g>
  <path d="M246.5 134.5 L235.2 140 L247.3 147 Z" fill="#0a1020" stroke="#0a1020" stroke-width="2" stroke-linejoin="round"/>

  <g stroke="url(#ring)" stroke-width="18" stroke-linecap="round">
    <line x1="184" y1="92" x2="184" y2="146"/>
    <line x1="328" y1="92" x2="328" y2="146"/>
  </g>

  <!-- four weeks: every third day from the start -->
  <g fill="#334155">
    <circle cx="176" cy="230" r="6"/><circle cx="216" cy="230" r="6"/><circle cx="296" cy="230" r="6"/><circle cx="336" cy="230" r="6"/>
    <circle cx="136" cy="276" r="6"/><circle cx="176" cy="276" r="6"/><circle cx="256" cy="276" r="6"/><circle cx="296" cy="276" r="6"/><circle cx="376" cy="276" r="6"/>
    <circle cx="136" cy="322" r="6"/><circle cx="216" cy="322" r="6"/><circle cx="256" cy="322" r="6"/><circle cx="336" cy="322" r="6"/><circle cx="376" cy="322" r="6"/>
    <circle cx="176" cy="368" r="6"/><circle cx="216" cy="368" r="6"/><circle cx="296" cy="368" r="6"/><circle cx="336" cy="368" r="6"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="256" cy="230" r="11"/><circle cx="376" cy="230" r="11"/>
    <circle cx="216" cy="276" r="11"/><circle cx="336" cy="276" r="11"/>
    <circle cx="176" cy="322" r="11"/><circle cx="296" cy="322" r="11"/>
    <circle cx="136" cy="368" r="11"/><circle cx="256" cy="368" r="11"/><circle cx="376" cy="368" r="11"/>
  </g>
  <circle cx="136" cy="230" r="34" fill="url(#glow)"/>
  <circle cx="136" cy="230" r="13" fill="#fde68a"/>
</svg>
